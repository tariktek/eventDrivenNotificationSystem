# sqlc turns the SQL in internal/repository/postgres/queries into type-safe
# Go (run `go generate ./...`). The schema is read from the migrations;
# golang-migrate *.down.sql files are ignored.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/repository/postgres/queries
    gen:
      go:
        package: sqlcgen
        out: internal/repository/postgres/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        output_files_suffix: .gen
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
