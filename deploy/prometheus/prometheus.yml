# Scrapes the API and every worker replica. Workers have no fixed address
# (docker compose scales them), so they are found through Docker's DNS:
# the service name "worker" resolves to all replicas.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]

  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8080
        refresh_interval: 15s
