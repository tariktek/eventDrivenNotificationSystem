openapi: 3.0.3
info:
  title: Event-Driven Notification System API
  version: 1.0.0
  description: |
    Create, track and cancel notifications delivered over SMS, email and push.

    ## Processing model
    Creating a notification only stores it and returns immediately (`201`).
    Workers deliver it asynchronously, at most **100 messages per second per
    channel**, highest priority first. Track progress with `GET` requests,
    the WebSocket stream (`GET /ws`) or a per-notification `callback_url`.

    ## Authentication
    Every `/api/v1` endpoint requires an `X-API-Key` header.

    ## Idempotency
    * **Request level** — send an `Idempotency-Key` header on `POST`
      requests. Retrying with the same key and body replays the original
      response (marked `Idempotent-Replayed: true`) instead of creating
      duplicates. The same key with a different body returns `422`; a retry
      while the first request is still running returns `409`.
    * **Notification level** — `idempotency_key` in the body. At most one
      notification ever exists per key; creating another returns the
      existing one.

    ## Errors
    Every error uses the `Error` schema. `422` responses list each invalid
    field by its JSON path, e.g. `items[3].recipient`.

    ## Correlation
    Send `X-Correlation-ID` to trace a request through logs, the queue and
    the provider call; one is generated if absent and is always echoed back.

    ## Real-time updates (WebSocket)
    `GET /ws` upgrades to a WebSocket. After connecting, send
    `{"action":"subscribe","notification_ids":[...],"batch_ids":[...]}` to
    receive `notification.status_changed` and `batch.completed` events.
  contact:
    name: Tarık Tek

servers:
  - url: http://localhost:8080
    description: Local (docker compose)

tags:
  - name: notifications
    description: Create, query, cancel and retry notifications.
  - name: batches
    description: Notifications created together in one request.
  - name: templates
    description: Reusable message templates with `{{.variable}}` placeholders.
  - name: ops
    description: Health probes for orchestrators. No authentication.

security:
  - ApiKeyAuth: []

paths:
  /api/v1/notifications:
    post:
      tags: [notifications]
      operationId: createNotification
      summary: Create a notification
      description: |
        Stores the notification and queues it for delivery. Provide either
        `content` (and `subject` for email) or a `template_id` with
        `template_vars`. A future `scheduled_at` delays delivery.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationCreate"
            examples:
              sms:
                summary: SMS
                value:
                  channel: sms
                  recipient: "+905551234567"
                  content: "Your verification code is 4821"
                  priority: high
              email-template:
                summary: Email from a template, scheduled
                value:
                  channel: email
                  recipient: user@example.com
                  template_id: 0192f5e4-7c1a-7b3e-9a41-2f0c8d6b1e77
                  template_vars: { name: Ada, order_id: "A-1042" }
                  scheduled_at: "2026-12-01T09:00:00Z"
                  callback_url: https://hooks.example.com/notifications
      responses:
        "201":
          description: Created and queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

    get:
      tags: [notifications]
      operationId: listNotifications
      summary: List notifications
      description: |
        Newest first. Uses cursor pagination: pass `next_cursor` from the
        previous page as `cursor` until `has_more` is false.
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - { name: channel, in: query, schema: { $ref: "#/components/schemas/Channel" } }
        - { name: priority, in: query, schema: { $ref: "#/components/schemas/Priority" } }
        - { name: batch_id, in: query, schema: { type: string, format: uuid } }
        - name: created_from
          in: query
          description: Inclusive lower bound on `created_at`.
          schema: { type: string, format: date-time }
        - name: created_to
          in: query
          description: Exclusive upper bound on `created_at`.
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of notifications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/notifications/batch:
    post:
      tags: [notifications, batches]
      operationId: createNotificationBatch
      summary: Create up to 1000 notifications at once
      description: |
        All-or-nothing: if any item is invalid, nothing is stored and the
        `422` response lists every problem by item index. Items whose
        `idempotency_key` already exists are not created again; they are
        returned with `duplicate: true`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchCreate" }
            example:
              metadata: { campaign: black-friday }
              items:
                - { channel: sms, recipient: "+905551234567", content: "50% off today only" }
                - { channel: push, recipient: "fcm:token-1", subject: Sale, content: "50% off today only" }
      responses:
        "201":
          description: Batch created and queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/notifications/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [notifications]
      operationId: getNotification
      summary: Get a notification with its delivery attempts
      responses:
        "200":
          description: The notification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/notifications/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [notifications]
      operationId: cancelNotification
      summary: Cancel a pending or scheduled notification
      description: Fails with `409` once a worker has picked it up.
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/notifications/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [notifications]
      operationId: retryNotification
      summary: Re-queue a failed notification
      description: |
        Moves a `failed` notification (the dead-letter state) back to
        `pending` with a fresh set of attempts. Other statuses return `409`.
      responses:
        "200":
          description: Re-queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/batches/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [batches]
      operationId: getBatch
      summary: Get a batch with per-status counts
      responses:
        "200":
          description: The batch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Batch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/batches/{id}/notifications:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [batches]
      operationId: listBatchNotifications
      summary: List the notifications of a batch
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of notifications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/batches/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [batches]
      operationId: cancelBatch
      summary: Cancel every pending or scheduled notification in a batch
      description: Notifications already being processed or finished are left as they are.
      responses:
        "200":
          description: Number of notifications cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchCancelled" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/templates:
    post:
      tags: [templates]
      operationId: createTemplate
      summary: Create a template
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateWrite" }
            example:
              name: order-shipped
              channel: email
              subject: "Order {{.order_id}} has shipped"
              body: "Hi {{.name}}, your order {{.order_id}} is on its way."
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [templates]
      operationId: listTemplates
      summary: List templates
      parameters:
        - { name: channel, in: query, schema: { $ref: "#/components/schemas/Channel" } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of templates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplatePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/templates/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [templates]
      operationId: getTemplate
      summary: Get a template
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [templates]
      operationId: updateTemplate
      summary: Replace a template
      description: Increments `version`. Notifications already created keep their rendered content.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateWrite" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [templates]
      operationId: deleteTemplate
      summary: Delete a template
      description: Soft delete; existing notifications keep a valid reference.
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/templates/{id}/preview:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [templates]
      operationId: previewTemplate
      summary: Render a template without sending anything
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplatePreviewRequest" }
            example:
              template_vars: { name: Ada, order_id: "A-1042" }
      responses:
        "200":
          description: Rendered output, already checked against channel limits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplatePreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /health:
    get:
      tags: [ops]
      operationId: getHealth
      summary: Liveness probe
      description: 200 while the process can serve HTTP. Never checks dependencies.
      security: []
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }

  /ready:
    get:
      tags: [ops]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        `200` when the instance can take work (`ok`, or `degraded` when a
        non-critical dependency such as Redis is down). `503` when a critical
        dependency is down or the instance is shutting down.
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
        "503":
          description: Not ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Makes the request safe to retry. Keys expire after 24 hours.
      schema: { type: string, minLength: 1, maxLength: 255 }
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque `next_cursor` from the previous page.
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed request (invalid JSON, wrong types, unknown fields).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The request conflicts with the current state (e.g. cancelling a notification already being sent, or an idempotent request still in progress).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: Request body exceeds the size limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: The request is well-formed but breaks a business rule.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: validation_failed
              message: The request contains invalid fields.
              details:
                - { field: "items[3].recipient", reason: "must be a phone number in E.164 format, e.g. +905551234567" }
            correlation_id: 0192f5e4-7c1a-7b3e-9a41-2f0c8d6b1e77
    InternalError:
      description: Unexpected server error. Safe to retry with an Idempotency-Key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Channel:
      type: string
      enum: [sms, email, push]
    Priority:
      type: string
      enum: [high, normal, low]
      default: normal
    Status:
      type: string
      enum: [pending, scheduled, processing, sent, failed, cancelled]
      description: |
        * `pending` — queued, waiting for a worker (also after a transient failure, until the next retry)
        * `scheduled` — waiting for `scheduled_at`
        * `processing` — a worker is delivering it
        * `sent` — accepted by the provider
        * `failed` — permanent error or attempts exhausted (dead letter; see `/retry`)
        * `cancelled` — cancelled before delivery

    Metadata:
      type: object
      additionalProperties: true
      description: Free-form client data (e.g. campaign IDs), stored and returned as-is. Max 4 KB.

    NotificationCreate:
      type: object
      additionalProperties: false
      required: [channel, recipient]
      properties:
        channel: { $ref: "#/components/schemas/Channel" }
        recipient:
          type: string
          description: |
            * sms — E.164 phone number, e.g. `+905551234567`
            * email — bare address, e.g. `user@example.com`
            * push — device token
        priority: { $ref: "#/components/schemas/Priority" }
        subject:
          type: string
          description: Required for email (max 255 chars, no line breaks). Optional push title. Not allowed for sms.
        content:
          type: string
          description: |
            Message body; required unless `template_id` is given.
            sms: up to 6 segments (918 GSM-7 or 402 UCS-2 characters) ·
            email: up to 100 KB · push: up to 1024 characters.
        template_id:
          type: string
          format: uuid
          description: Render this template instead of sending `subject`/`content`.
        template_vars:
          type: object
          additionalProperties: true
          description: Values for the template's placeholders. Max 16 KB.
        scheduled_at:
          type: string
          format: date-time
          description: Deliver no earlier than this time (at most 30 days ahead).
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
          description: At most one notification ever exists per key.
        max_attempts:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
        callback_url:
          type: string
          format: uri
          description: HTTPS endpoint that receives signed status updates.
        metadata: { $ref: "#/components/schemas/Metadata" }

    Notification:
      type: object
      required: [id, channel, priority, recipient, content, status, attempts, max_attempts, next_attempt_at, metadata, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        batch_id: { type: string, format: uuid }
        channel: { $ref: "#/components/schemas/Channel" }
        priority: { $ref: "#/components/schemas/Priority" }
        recipient: { type: string }
        subject: { type: string }
        content: { type: string, description: "Final content, after template rendering." }
        segments: { type: integer, description: SMS segment count. }
        template_id: { type: string, format: uuid }
        template_version: { type: integer }
        status: { $ref: "#/components/schemas/Status" }
        idempotency_key: { type: string }
        attempts: { type: integer, description: Delivery attempts made so far. }
        max_attempts: { type: integer }
        next_attempt_at: { type: string, format: date-time, description: When the notification is next due (pending/scheduled only). }
        scheduled_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time }
        failed_at: { type: string, format: date-time }
        cancelled_at: { type: string, format: date-time }
        provider_message_id: { type: string, description: The provider's `messageId` once sent. }
        last_error: { type: string }
        last_error_code: { type: string }
        callback_url: { type: string }
        metadata: { $ref: "#/components/schemas/Metadata" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NotificationDetail:
      allOf:
        - $ref: "#/components/schemas/Notification"
        - type: object
          required: [delivery_attempts]
          properties:
            delivery_attempts:
              type: array
              items: { $ref: "#/components/schemas/DeliveryAttempt" }

    DeliveryAttempt:
      type: object
      required: [attempt_no, outcome, duration_ms, created_at]
      properties:
        attempt_no: { type: integer }
        outcome:
          type: string
          enum: [success, transient_error, permanent_error]
        status_code: { type: integer, description: Provider HTTP status; absent on network errors. }
        error_code: { type: string }
        error: { type: string }
        provider_message_id: { type: string }
        duration_ms: { type: integer }
        created_at: { type: string, format: date-time }

    NotificationPage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        next_cursor: { type: string, description: Pass as `cursor` to get the next page. }
        has_more: { type: boolean }

    BatchCreate:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/NotificationCreate" }
        metadata: { $ref: "#/components/schemas/Metadata" }

    BatchCreated:
      type: object
      required: [batch_id, total, notifications]
      properties:
        batch_id: { type: string, format: uuid }
        total: { type: integer }
        notifications:
          type: array
          description: One entry per item, in request order.
          items:
            type: object
            required: [id, status, duplicate]
            properties:
              id: { type: string, format: uuid }
              status: { $ref: "#/components/schemas/Status" }
              duplicate:
                type: boolean
                description: True when the item's idempotency_key already existed and no new notification was created.

    Batch:
      type: object
      required: [id, total, counts, progress, metadata, created_at]
      properties:
        id: { type: string, format: uuid }
        total: { type: integer }
        counts:
          type: object
          required: [pending, scheduled, processing, sent, failed, cancelled]
          properties:
            pending: { type: integer }
            scheduled: { type: integer }
            processing: { type: integer }
            sent: { type: integer }
            failed: { type: integer }
            cancelled: { type: integer }
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Share of notifications in a final status (sent, failed or cancelled).
        completed_at: { type: string, format: date-time }
        metadata: { $ref: "#/components/schemas/Metadata" }
        created_at: { type: string, format: date-time }

    BatchCancelled:
      type: object
      required: [batch_id, cancelled]
      properties:
        batch_id: { type: string, format: uuid }
        cancelled: { type: integer }

    TemplateWrite:
      type: object
      additionalProperties: false
      required: [name, channel, body]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[a-z0-9][a-z0-9_-]*$"
        channel: { $ref: "#/components/schemas/Channel" }
        subject:
          type: string
          description: Email subject or push title; may contain placeholders. Required for email.
        body:
          type: string
          description: |
            Go text/template syntax: `{{.name}}`. Helpers: `upper`, `lower`,
            `trim`, `default`, `len`, comparisons and `if`/`range`/`with`.
            `printf`, `index`, nested `range` and `{{template}}` are not allowed.

    Template:
      type: object
      required: [id, name, channel, body, variables, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        channel: { $ref: "#/components/schemas/Channel" }
        subject: { type: string }
        body: { type: string }
        variables:
          type: array
          items: { type: string }
          description: Placeholders the template uses; all must be supplied when rendering.
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TemplatePage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Template" }
        next_cursor: { type: string }
        has_more: { type: boolean }

    TemplatePreviewRequest:
      type: object
      additionalProperties: false
      properties:
        template_vars:
          type: object
          additionalProperties: true

    TemplatePreview:
      type: object
      required: [content]
      properties:
        subject: { type: string }
        content: { type: string }
        segments: { type: integer, description: SMS segment count. }

    HealthReport:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        reason: { type: string }
        checks:
          type: object
          additionalProperties:
            type: object
            required: [status, critical, latency_ms]
            properties:
              status: { type: string, enum: [ok, degraded, down] }
              critical: { type: boolean }
              latency_ms: { type: integer }
              error: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorBody" }
        correlation_id: { type: string }

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string, description: Human-readable summary. }
        details:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }

    ErrorCode:
      type: string
      description: Stable, machine-readable code.
      enum:
        - bad_request
        - unauthorized
        - not_found
        - conflict
        - invalid_status_transition
        - idempotency_key_reused
        - request_in_progress
        - payload_too_large
        - validation_failed
        - internal_error

    FieldError:
      type: object
      required: [field, reason]
      properties:
        field: { type: string, description: JSON path of the invalid field. }
        reason: { type: string }
