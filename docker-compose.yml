name: notification-system

# Settings shared by every application container.
x-app: &app
  build:
    context: .
    args:
      VERSION: ${VERSION:-dev}
      COMMIT: ${COMMIT:-none}
  image: notification-system:local
  restart: unless-stopped
  # Must exceed SHUTDOWN_TIMEOUT so Docker never SIGKILLs a draining process.
  stop_grace_period: 30s
  environment: &app-env
    APP_ENV: development
    LOG_LEVEL: ${LOG_LEVEL:-info}
    LOG_FORMAT: json
    SHUTDOWN_TIMEOUT: 20s
    DATABASE_URL: postgres://notification:notification@postgres:5432/notification?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    # Bundled mock provider by default; set PROVIDER_URL (e.g. in .env) to a
    # webhook.site URL to deliver there instead.
    PROVIDER_URL: ${PROVIDER_URL:-http://mockprovider:9000/send}
    # Local development key; send it as X-API-Key (Swagger UI: "Authorize").
    API_KEYS: ${API_KEYS:-dev-api-key-change-me}
    # Local development: allow http:// and private-network callback URLs so
    # callbacks can target containers. Refused when APP_ENV=production.
    CALLBACK_ALLOW_INSECURE: "true"
    CALLBACK_ALLOW_PRIVATE: "true"
    # Signs status callbacks. The mock provider's /callbacks endpoint
    # verifies with the same value, so http://mockprovider:9000/callbacks
    # works as a callback_url out of the box.
    CALLBACK_SIGNING_SECRET: ${CALLBACK_SIGNING_SECRET:-dev-callback-secret-change-me}
    # Traces to Jaeger (http://localhost:16686).
    TRACING_ENABLED: "true"
    TRACING_ENDPOINT: http://jaeger:4318
    TRACING_SAMPLE_RATIO: ${TRACING_SAMPLE_RATIO:-1}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
      POSTGRES_DB: notification
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Append-only file so Redis Streams survive a container restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies versioned schema migrations once, then exits.
  migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://notification:notification@postgres:5432/notification?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    ports:
      - "8080:8080"

  worker:
    <<: *app
    entrypoint: ["/app/worker"]
    # Two instances share the per-channel rate limit through Redis.
    deploy:
      replicas: 2
    environment:
      <<: *app-env
      WORKER_EXPECTED_INSTANCES: "2"

  # Stand-in for the external provider, with fault injection and stats:
  #   GET  http://localhost:9000/admin/stats
  #   PUT  http://localhost:9000/admin/config  {"failure_rate": 0.5, "latency": "50ms"}
  mockprovider:
    image: notification-system:local
    entrypoint: ["/app/mockprovider"]
    environment:
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0}
      MOCK_RATE_LIMIT_RATE: ${MOCK_RATE_LIMIT_RATE:-0}
      MOCK_PERMANENT_FAILURE_RATE: ${MOCK_PERMANENT_FAILURE_RATE:-0}
      MOCK_CALLBACK_SECRET: ${CALLBACK_SIGNING_SECRET:-dev-callback-secret-change-me}
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---- Observability ---------------------------------------------------
  # Prometheus: http://localhost:9090 (alerts at /alerts)
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  # Grafana: http://localhost:3000 (dashboard "Notification System";
  # anonymous viewing, admin/admin to edit)
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/notifications.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped

  # Jaeger: http://localhost:16686. Receives OTLP over HTTP on 4318.
  jaeger:
    image: jaegertracing/all-in-one:1.60.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
