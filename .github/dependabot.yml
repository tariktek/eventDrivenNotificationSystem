# Weekly update PRs for Go modules, GitHub Actions and the Dockerfile's
# base images. Minor and patch updates are grouped to keep the noise down;
# CI (tests, govulncheck, Trivy) vets each PR.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
