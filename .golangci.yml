version: "2"

run:
  timeout: 5m
  build-tags:
    - integration
    - e2e

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose       # unclosed HTTP response bodies (provider client)
    - contextcheck    # functions that drop the incoming context
    - errorlint       # errors.Is/As instead of == on wrapped errors
    - gocritic
    - gosec
    - misspell
    - nilerr          # returning nil after checking err != nil
    - noctx           # HTTP requests without a context
    - revive
    - rowserrcheck    # unchecked rows.Err()
    - sqlclosecheck   # unclosed rows/statements
    - unconvert
    - unparam
    - usestdlibvars   # http.MethodPost instead of "POST", etc.
  settings:
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks:
        - hugeParam # Config structs are passed by value on purpose
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: context-as-argument
        - name: error-return
        - name: error-naming
        - name: receiver-naming
        - name: unused-parameter
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, unparam]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tariktek/eventDrivenNotificationSystem
